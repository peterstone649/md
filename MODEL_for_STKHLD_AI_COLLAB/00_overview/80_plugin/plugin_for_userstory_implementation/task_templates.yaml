# Task Templates Configuration
# Common task patterns for user story implementation

version: "1.0.0"
description: "Reusable task templates for common implementation patterns"

# Data modeling templates
data_modeling:
  basic_entity:
    name: "Basic Entity Model"
    description: "Template for creating simple data entities"
    steps:
      - step: "define_entity"
        action: "Identify entity name and purpose"
        details: "What does this entity represent in the business domain?"
      
      - step: "identify_attributes"
        action: "List entity attributes"
        details: "What properties does this entity need to store?"
      
      - step: "define_relationships"
        action: "Map entity relationships"
        details: "How does this entity relate to other entities?"
      
      - step: "create_validation"
        action: "Add validation rules"
        details: "What constraints apply to this entity's data?"
    
    output: "Entity definition with attributes, relationships, and validation"
  
  relational_model:
    name: "Relational Data Model"
    description: "Template for complex relational database design"
    steps:
      - step: "normalize_data"
        action: "Apply normalization rules"
        details: "Ensure data is properly normalized to 3NF"
      
      - step: "define_tables"
        action: "Create table structures"
        details: "Design database tables with proper keys"
      
      - step: "establish_constraints"
        action: "Add foreign key constraints"
        details: "Define referential integrity rules"
      
      - step: "optimize_indexes"
        action: "Plan indexing strategy"
        details: "Identify performance-critical fields"
    
    output: "Complete database schema design"

# API development templates
api_development:
  restful_api:
    name: "RESTful API Design"
    description: "Template for creating RESTful web services"
    steps:
      - step: "define_endpoints"
        action: "Design resource endpoints"
        details: "What HTTP methods and URLs are needed?"
      
      - step: "specify_payloads"
        action: "Define request/response formats"
        details: "What JSON/XML structures are expected?"
      
      - step: "implement_authentication"
        action: "Add security measures"
        details: "How will API access be authenticated?"
      
      - step: "add_error_handling"
        action: "Create error responses"
        details: "What error codes and messages are appropriate?"
    
    output: "Complete API specification and implementation"
  
  graphql_api:
    name: "GraphQL API Design"
    description: "Template for creating GraphQL services"
    steps:
      - step: "define_schema"
        action: "Create type definitions"
        details: "What GraphQL types and queries are needed?"
      
      - step: "implement_resolvers"
        action: "Add resolver functions"
        details: "How will queries be resolved to data?"
      
      - step: "add_middleware"
        action: "Implement middleware"
        details: "What authentication and validation is needed?"
      
      - step: "optimize_performance"
        action: "Add caching and optimization"
        details: "How will performance be optimized?"
    
    output: "Complete GraphQL API implementation"

# UI implementation templates
ui_implementation:
  web_interface:
    name: "Web Interface Design"
    description: "Template for creating web-based user interfaces"
    steps:
      - step: "create_wireframes"
        action: "Design interface layout"
        details: "What are the key screens and their elements?"
      
      - step: "implement_components"
        action: "Build UI components"
        details: "What reusable components are needed?"
      
      - step: "add_interactions"
        action: "Implement user interactions"
        details: "How will users interact with the interface?"
      
      - step: "test_responsiveness"
        action: "Ensure responsive design"
        details: "How does the interface work on different devices?"
    
    output: "Complete responsive web interface"
  
  mobile_interface:
    name: "Mobile Interface Design"
    description: "Template for creating mobile user interfaces"
    steps:
      - step: "design_mobile_layout"
        action: "Create mobile-specific layout"
        details: "How will the interface adapt to small screens?"
      
      - step: "implement_touch_interactions"
        action: "Add touch-friendly interactions"
        details: "What gestures and interactions work on mobile?"
      
      - step: "optimize_performance"
        action: "Optimize for mobile performance"
        details: "How will the interface perform on mobile devices?"
      
      - step: "test_cross_platform"
        action: "Ensure cross-platform compatibility"
        details: "How will the interface work on different mobile platforms?"
    
    output: "Complete mobile interface implementation"

# Testing templates
testing:
  unit_testing:
    name: "Unit Test Creation"
    description: "Template for creating comprehensive unit tests"
    steps:
      - step: "identify_test_cases"
        action: "Define test scenarios"
        details: "What functionality needs to be tested?"
      
      - step: "create_test_data"
        action: "Generate test data"
        details: "What test data is needed for each scenario?"
      
      - step: "implement_tests"
        action: "Write test code"
        details: "How will each test be implemented?"
      
      - step: "run_and_validate"
        action: "Execute and validate tests"
        details: "Do all tests pass and provide good coverage?"
    
    output: "Complete unit test suite"
  
  integration_testing:
    name: "Integration Test Creation"
    description: "Template for creating integration tests"
    steps:
      - step: "identify_integration_points"
        action: "Map system integration points"
        details: "Where do different components interact?"
      
      - step: "create_integration_scenarios"
        action: "Design integration test scenarios"
        details: "What end-to-end workflows need testing?"
      
      - step: "implement_integration_tests"
        action: "Write integration test code"
        details: "How will integration scenarios be tested?"
      
      - step: "validate_system_behavior"
        action: "Verify system integration"
        details: "Do all components work together correctly?"
    
    output: "Complete integration test suite"

# Common implementation patterns
common_patterns:
  error_handling:
    name: "Error Handling Pattern"
    description: "Template for implementing consistent error handling"
    steps:
      - step: "define_error_types"
        action: "Categorize error types"
        details: "What kinds of errors can occur?"
      
      - step: "create_error_responses"
        action: "Design error response format"
        details: "How should errors be communicated?"
      
      - step: "implement_logging"
        action: "Add error logging"
        details: "How will errors be logged for debugging?"
      
      - step: "add_recovery_mechanisms"
        action: "Implement error recovery"
        details: "How can the system recover from errors?"
    
    output: "Complete error handling system"
  
  data_validation:
    name: "Data Validation Pattern"
    description: "Template for implementing data validation"
    steps:
      - step: "define_validation_rules"
        action: "Create validation rules"
        details: "What data validation is required?"
      
      - step: "implement_validation_logic"
        action: "Add validation code"
        details: "How will data be validated?"
      
      - step: "create_error_messages"
        action: "Design user-friendly error messages"
        details: "How will validation errors be communicated?"
      
      - step: "add_validation_tests"
        action: "Test validation logic"
        details: "How will validation be tested?"
    
    output: "Complete data validation system"

