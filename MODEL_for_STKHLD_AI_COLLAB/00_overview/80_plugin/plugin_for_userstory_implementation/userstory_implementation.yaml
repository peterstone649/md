# User Story Implementation Configuration
# YAML-based plugin for implementing user stories with AI assistance

version: "1.0.0"
plugin_type: "userstory_implementation"
description: "Guides AI through user story implementation process"

# User story analysis patterns
story_analysis:
  required_elements:
    - "user_role"
    - "action"
    - "business_value"
    - "acceptance_criteria"
  
  optional_elements:
    - "priority"
    - "complexity"
    - "dependencies"
    - "technical_constraints"
  
  analysis_rules:
    - rule: "identify_user_role"
      pattern: "(As a|I am a|We need a)"
      description: "Extract who benefits from the story"
    
    - rule: "identify_action"
      pattern: "(I want to|We need to|Should be able to)"
      description: "Extract what needs to be done"
    
    - rule: "identify_value"
      pattern: "(So that|In order to|To achieve)"
      description: "Extract why this is needed"

# Implementation phases
implementation_phases:
  phase_1_analysis:
    name: "Requirement Analysis"
    duration: "1-2_hours"
    tasks:
      - "Parse user story elements"
      - "Identify technical requirements"
      - "Determine dependencies"
      - "Estimate complexity"
    deliverables:
      - "Technical specification"
      - "Task breakdown"
      - "Dependency map"
  
  phase_2_design:
    name: "System Design"
    duration: "2-4_hours"
    tasks:
      - "Design system architecture"
      - "Define data models"
      - "Plan API interfaces"
      - "Identify technology stack"
    deliverables:
      - "Architecture diagram"
      - "Data model definitions"
      - "API specifications"
  
  phase_3_implementation:
    name: "Development"
    duration: "4-8_hours"
    tasks:
      - "Set up development environment"
      - "Implement core functionality"
      - "Add error handling"
      - "Write unit tests"
    deliverables:
      - "Working implementation"
      - "Unit test coverage"
      - "Code documentation"
  
  phase_4_validation:
    name: "Testing & Validation"
    duration: "1-2_hours"
    tasks:
      - "Run acceptance tests"
      - "Perform integration testing"
      - "Validate against criteria"
      - "Document results"
    deliverables:
      - "Test results"
      - "Validation report"
      - "Implementation summary"

# Task templates for common patterns
task_templates:
  data_modeling:
    steps:
      - "Identify entities and relationships"
      - "Define data structures"
      - "Create validation rules"
      - "Plan storage strategy"
  
  api_development:
    steps:
      - "Define endpoints"
      - "Implement request handling"
      - "Add response formatting"
      - "Include error responses"
  
  ui_implementation:
    steps:
      - "Create wireframes"
      - "Implement components"
      - "Add user interactions"
      - "Test usability"

# Progress tracking
progress_tracking:
  metrics:
    - "tasks_completed"
    - "phases_completed"
    - "acceptance_criteria_met"
    - "time_estimated_vs_actual"
  
  checkpoints:
    - "After requirement analysis"
    - "After system design"
    - "After core implementation"
    - "After validation"

# AI guidance rules
ai_guidance:
  communication_style: "supportive_and_clear"
  detail_level: "medium"
  feedback_frequency: "after_each_task"
  
  response_patterns:
    - when: "user_asks_for_help"
      response: "provide_step_by_step_guidance"
    
    - when: "user_makes_progress"
      response: "acknowledge_and_encourage"
    
    - when: "user_encounters_error"
      response: "troubleshoot_and_support"

